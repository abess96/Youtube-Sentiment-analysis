stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
    - src/data/data_ingestion.py
    params:
    - data_ingestion.test_size
    outs:
    - data/raw

  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
    - data/raw/train.csv
    - data/raw/test.csv
    - src/data/data_preprocessing.py
    - src/data/enhanced_data_pipeline.py
    - src/data/data_quality_validator.py
    - src/data/advanced_preprocessing.py
    params:
    - data_preprocessing.quality_threshold
    - data_preprocessing.language_filter
    - data_preprocessing.processing_strategy
    - data_preprocessing.preprocessing_mode
    - data_preprocessing.enable_ab_testing
    - data_preprocessing.enable_enhanced_pipeline
    - data_preprocessing.enable_mlflow_logging
    outs:
    - data/interim/train_processed.csv
    - data/interim/test_processed.csv
    metrics:
    - data/interim/train_quality_report.json
    - data/interim/test_quality_report.json

  feature_extraction:
    cmd: python src/features/extract_features.py
    deps:
    - data/interim/train_processed.csv
    - data/interim/test_processed.csv
    - src/features/extract_features.py
    - src/features/feature_engine.py
    params:
    - feature_extraction.tfidf_max_features
    - feature_extraction.embedding_dim
    outs:
    - data/features/extracted_features.pkl

  feature_selection:
    cmd: python src/features/select_features.py
    deps:
    - data/features/extracted_features.pkl
    - src/features/select_features.py
    - src/features/feature_engine.py
    params:
    - feature_selection.n_features_to_select
    - feature_selection.selection_method
    outs:
    - data/features/selected_features.pkl
    - data/features/feature_ranking.csv

  model_building:
    cmd: python src/models/base/model_factory.py
    deps:
    - data/features/selected_features.pkl
    - src/models/base/model_factory.py
    params:
    - model_building.max_features
    - model_building.ngram_range
    - model_building.learning_rate
    - model_building.max_depth
    - model_building.n_estimators
    outs:
    - lgbm_model.pkl
    - tfidf_vectorizer.pkl

  advanced_model_training:
    cmd: python src/training/trainer.py
    deps:
    - data/features/selected_features.pkl
    - src/training/trainer.py
    - src/models/base/model_factory.py
    - src/models/base/base_model.py
    params:
    - advanced_models.model_types
    - advanced_models.enable_deep_learning
    - advanced_models.enable_transformers
    - advanced_models.enable_ensemble
    - advanced_models.enable_hyperparameter_tuning
    outs:
    - models/trained_models/
    metrics:
    - models/metrics/training_metrics.json:
        cache: false

  model_evaluation:
    cmd: python src/evaluation/metrics.py
    deps:
    - lgbm_model.pkl
    - tfidf_vectorizer.pkl
    - models/trained_models/
    - data/interim/train_processed.csv
    - data/interim/test_processed.csv
    - src/evaluation/metrics.py
    outs:
    - experiment_info.json
    metrics:
    - models/metrics/evaluation_metrics.json:
        cache: false

  data_quality_analysis:
    cmd: python src/data/quality_analysis.py
    deps:
    - data/interim/train_quality_report.json
    - data/interim/test_quality_report.json
    - src/data/quality_analysis.py
    outs:
    - data/reports/quality_analysis.html
    - data/reports/quality_metrics.json

  model_registration:
    cmd: python src/mlops/model_registry.py
    deps:
    - experiment_info.json
    - models/trained_models/
    - src/mlops/model_registry.py

  comprehensive_evaluation:
    cmd: python src/evaluation/evaluation_pipeline.py
    deps:
    - data/features/extracted_features.pkl
    - data/interim/test_processed.csv
    - lgbm_model.pkl
    - src/evaluation/evaluation_pipeline.py
    - src/evaluation/evaluator.py
    - src/evaluation/bias_detection.py
    - src/evaluation/drift_detection.py
    params:
    - evaluation.n_cv_folds
    - evaluation.drift_threshold
    - evaluation.fairness_threshold
    - evaluation.enable_bias_detection
    - evaluation.enable_drift_monitoring
    outs:
    - models/evaluation/evaluation_report.txt
    - models/evaluation/drift_monitoring_history.json
    metrics:
    - models/evaluation/comprehensive_metrics.json:
        cache: false
    - models/evaluation/bias_report.json:
        cache: false
    - models/evaluation/drift_report.json:
        cache: false

  enhanced_tracking:
    cmd: python src/mlops/experiment_tracking.py
    deps:
    - data/features/selected_features.pkl
    - src/mlops/experiment_tracking.py
    - src/mlops/lifecycle_manager.py
    params:
    - enhanced_tracking.model_type
    - enhanced_tracking.n_estimators
    outs:
    - models/enhanced_tracked/
    metrics:
    - models/metrics/enhanced_tracking_metrics.json:
        cache: false

  continuous_learning:
    cmd: python src/examples/continuous_learning_example.py
    deps:
    - src/examples/continuous_learning_example.py
    - src/training/incremental_learner.py
    - src/training/active_learner.py
    - src/training/auto_retrainer.py
    - src/evaluation/drift_detection.py
    - src/training/continuous_learning.py
    params:
    - continuous_learning.enable_incremental_learning
    - continuous_learning.enable_active_learning
    - continuous_learning.enable_auto_retraining
    - continuous_learning.incremental_learning.batch_size
    - continuous_learning.active_learning.strategy
    - continuous_learning.auto_retraining.retrain_threshold
    outs:
    - models/continuous_learning/incremental_model.pkl
    metrics:
    - models/continuous_learning/retrain_history.json:
        cache: false
    - models/continuous_learning/drift_history.json:
        cache: false
data_ingestion:
  test_size: 0.20

data_preprocessing:
  # Enhanced preprocessing parameters
  quality_threshold: 0.6
  language_filter: 'en'
  processing_strategy: 'balanced'  # options: quality_first, speed_first, balanced
  preprocessing_mode: 'conservative'  # options: conservative, aggressive
  enable_ab_testing: false
  enable_enhanced_pipeline: true  # Set to false to use legacy preprocessing
  enable_mlflow_logging: true  # Enable MLflow integration for data processing

model_building:
  ngram_range: [1, 3]  
  max_features: 1000
  learning_rate: 0.09
  max_depth: 20
  n_estimators: 367
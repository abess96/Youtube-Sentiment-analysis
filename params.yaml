data_ingestion:
  test_size: 0.2

data_preprocessing:
  quality_threshold: 0.6
  language_filter: 'en'
  processing_strategy: 'balanced'
  preprocessing_mode: 'conservative'
  enable_ab_testing: false
  enable_enhanced_pipeline: true
  enable_mlflow_logging: true

feature_extraction:
  tfidf_max_features: 5000
  embedding_dim: 100
  enable_word2vec: false
  enable_fasttext: false
  enable_transformers: false

feature_selection:
  n_features_to_select: 1000
  selection_method: 'mutual_info'
  enable_interaction_detection: false

model_building:
  max_features: 5000
  ngram_range: [1, 2]
  learning_rate: 0.1
  max_depth: 7
  n_estimators: 100

advanced_models:
  model_types: ['random_forest', 'xgboost', 'lightgbm']
  enable_deep_learning: false
  enable_transformers: false
  enable_ensemble: true
  enable_hyperparameter_tuning: false
  
  # Traditional ML models
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 2
    random_state: 42
  
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    random_state: 42
  
  lightgbm:
    n_estimators: 100
    max_depth: 7
    learning_rate: 0.1
    num_leaves: 31
    random_state: 42
  
  # Deep learning models (when enabled)
  lstm:
    vocab_size: 10000
    num_classes: 3
    embedding_dim: 128
    hidden_dim: 256
    n_layers: 2
    dropout: 0.5
    epochs: 10
    batch_size: 32
  
  # Transformer models (when enabled)
  bert:
    model_name: 'bert-base-uncased'
    num_classes: 3
    max_length: 128
    epochs: 3
    batch_size: 16
    learning_rate: 2e-5
  
  distilbert:
    model_name: 'distilbert-base-uncased'
    num_classes: 3
    max_length: 128
    epochs: 3
    batch_size: 16
    learning_rate: 2e-5
  
  # Ensemble configuration
  ensemble:
    type: 'voting'  # voting, stacking, or blending
    voting_type: 'soft'  # hard or soft
    weights: null  # null for equal weights
  
  # Hyperparameter tuning
  hyperparameter_tuning:
    method: 'bayesian'  # grid, random, or bayesian
    n_trials: 50
    cv_folds: 5
    optimization_budget: 'medium'  # low, medium, or high

mlflow:
  experiment_name: 'sentiment_analysis'
  # tracking_uri is configured via .env file (MLFLOW_TRACKING_URI)
  # For DagsHub: set MLFLOW_TRACKING_URI and DAGSHUB_PAT in .env
  # For local: leave empty or set to './mlruns'
  enable_autolog: true

dvc:
  remote: 'default'
  enable_model_versioning: true